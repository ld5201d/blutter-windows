name: Build blutter (windows x64)

on:
  workflow_dispatch:
    inputs:
      dart_version:
        description: 'Dart version (e.g. 3.3.4)'
        required: true
        default: '3.3.4'
      compressed_ptrs:
        description: 'snapshot uses compressed pointers?'
        required: true
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyelftools requests cmake ninja

      - name: Download ICU4C & capstone
        run: python scripts/init_env_win.py

      - name: Build Dart VM + blutter
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" >nul
          set SUFFIX=_android_arm64
          if "${{ inputs.compressed_ptrs }}"=="false" set SUFFIX=%SUFFIX%_no-compressed-ptrs
          python blutter.py --dart-version ${{ inputs.dart_version }}%SUFFIX% --build-only NUL build_out || exit 1

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item bin/blutter_*.exe artifact/
          Copy-Item bin/*.dll artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: blutter-${{ inputs.dart_version }}-windows-x64
          path: artifact/

  analyze-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libicu-dev libcapstone-dev clang
          pip install pyelftools requests
      - name: Full analysis
        run: |
          python blutter.py --dart-version 3.10.7_android_arm64 payload/libapp.so analysis_out || true
      - name: Collect
        uses: actions/upload-artifact@v4
        with:
          name: analysis-linux-3.10.7
          path: analysis_out/
